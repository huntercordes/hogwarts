info:
  name: 1 Get all courses
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/courses
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
