info:
  name: Update student
  type: http

http:
  method: PUT
  url: http://localhost:3000/students/7
  body:
    type: json
    data: |-
      {
        "name": "Neville Longbottom",
        "year": 6,
        "house_id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
